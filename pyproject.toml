[project]
name = "hollow"
version = "2.0.0"
description = "Agents that choose their own goals, gated by red-green CI. Git is the substrate."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
