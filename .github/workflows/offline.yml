name: Offline package

on:
  push:
    branches: [main, joi-forge]
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - name: Build offline package
        run: npm run build:offline
      - name: Start the package with its own launcher server
        run: |
          python3 dist-offline/serve.py --no-open > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5224/forge > /dev/null && exit 0; sleep 1; done
          cat serve.log; exit 1
      - name: Install browser for the smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Offline smoke test (network blocked, local media must play)
        run: node e2e/offline-smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: joi-forge-offline
          path: release/joi-forge-offline.zip
          retention-days: 30
