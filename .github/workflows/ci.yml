# Tests for Hollow itself (the system, not the agents' workspace).
# Includes the acceptance bar from the rebuild spec, §8.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "site/**", "workspace/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["state/**", "site/**", "workspace/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --quiet pytest
      - run: git config --global user.email ci@hollow.invalid && git config --global user.name ci
      - run: python -m pytest tests -q
